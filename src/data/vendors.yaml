# --------------------------------------------------------------------------------
# vendors.yaml
#
# A manually updated list of AI vendors and relevant metadata to the project.
#
# TODO: Add 'unit' to the metadata
# TODO: Add a field for requiring a third-party observability tool
#
# Domain values: hyperscaler, independent, inference, generative, infrastructure
#
# costApi values:
#   - yes: Actual dollar values returned
#   - no: No actual dollar values returned
#   - partial: Requires some form of calculation (credits * rate) to obtain cost
#
# verified: true — we've built a connector for this provider (shows badge in UI)

# --------------------------------------------------------------------------------

# ------------------------------------
# Hyperscalers

# ------------------------------------

- name: AWS
  slug: aws
  domain: hyperscaler
  costApi: yes
  usageApi: yes
  billingExport: yes
  granularity: Per-model, per-token, per-invocation; plus per-IAM-principal, per-application-inference-profile, per-project/workspace, and per-request-metadata attribution (native dollar grain is per usage type per day)

  website: https://aws.amazon.com/bedrock/
  notes: >
    Cost Explorer API (GetCostAndUsage) returns USD; no dedicated Bedrock cost
    API. CloudWatch AWS/Bedrock metrics (InputTokenCount, OutputTokenCount,
    Invocations; added TTFT and quota-consumption metrics). Model invocation
    logging gives per-request token counts. Billing export via CUR 2.0 / Data
    Exports to S3 with cost allocation tags. April 2026 added IAM-principal
    cost allocation (line_item_iam_principal column, GA 2026-04-09), Bedrock
    Projects/Workspaces, and Application inference profiles for per-app
    attribution -- all aggregated to per usage type per day, no per-request
    dollar rows.

- name: Azure
  slug: azure
  domain: hyperscaler
  costApi: yes
  usageApi: yes
  billingExport: yes
  granularity: Per-model, per-token, per-deployment, per-region, per-API-operation, per-service-tier, per-stream-type, subscription-level

  website: https://azure.microsoft.com/en-us/products/ai-services/openai-service
  notes: >
    Azure Cost Management API (Query/Views, API version 2026-06-01) provides
    subscription-level cost data with resource tags for per-project attribution.
    Azure Monitor exposes token usage metrics (ProcessedPromptTokens,
    GeneratedTokens, TotalTokens, InputTokens, OutputTokens, plus audio and
    cache token metrics) broken down by ModelDeploymentName, ModelName,
    ModelVersion, Region, ApiName, ServiceTierRequest/Response, and StreamType,
    plus Model Router and latency metrics (TTFB, tokens per second). Billing can
    be exported to a Storage Account as CSV or Parquet on a schedule. Supports
    fine-grained cost allocation via tags and management groups. Docs are moving
    under the Microsoft Foundry Models branding.

- name: GCP
  slug: gcp
  domain: hyperscaler
  costApi: yes
  usageApi: yes
  billingExport: yes
  granularity: Per-model, per-prediction, SKU-level

  website: https://cloud.google.com/vertex-ai
  notes: >
    Cloud Billing API returns USD; Cloud Billing Catalog API lists SKU list
    prices. Pricing API (Preview) exposes account-specific contract prices down
    to SKU level. BigQuery billing export (Standard, Detailed, Pricing; FOCUS
    1.2 export still in Preview since 2026-06). Cloud Monitoring exports Vertex
    AI token-count metrics, queryable via the Monitoring API. Labels for
    attribution; multi-project cost views (2026-06) plus an "Originating
    products" cost dimension (2026-08-07) that attributes costs such as Gemini
    Enterprise consumption back to the driving product.

- name: Oracle
  slug: oracle
  domain: hyperscaler
  costApi: yes
  usageApi: partial
  billingExport: yes
  granularity: SKU and character-transaction level detail

  website: https://docs.oracle.com
  notes: >
    Has SKU/character-transaction level detail, but not token-level spend
    detail. The Usage API (RequestSummarizedUsages with queryType USAGE) returns
    aggregate unit quantities grouped by service, SKU, and unit in daily or
    monthly buckets, separate from the COST query type, but still not
    per-request or per-key. Cost and Usage Reports land in an Oracle-owned
    Object Storage bucket every 6 hours (proprietary and FOCUS formats).
    Requires a third-party observability tool for token-level attribution.

# ------------------------------------
# Frontier Model Providers

# ------------------------------------

- name: OpenAI
  slug: openai
  domain: independent
  costApi: yes
  usageApi: yes
  billingExport: partial
  granularity: Per-model, per-request, tokens aggregated to API key*

  website: https://openai.com
  notes: >
    Usage API (/organization/usage) provides token-level data by model and API
    key. Costs API (/organization/costs) returns USD amounts by day; since
    2026-08-04 both the Usage and Costs APIs filter and group by API key.
    Response headers include token counts. CSV export from dashboard. No
    real-time cost API -- costs computed asynchronously. Since April 2026
    Enterprise invoices no longer itemize API costs; the manual Cost and
    Activity exports are the only reconciliation path.

- name: Anthropic
  slug: anthropic
  domain: independent
  costApi: yes
  usageApi: yes
  billingExport: partial
  granularity: Per-model, per-workspace, per-API-key, per-service-tier, per-context-window; aggregated in 1m/1h/1d buckets, per-request tokens in the response usage object

  website: https://anthropic.com
  notes: >
    Response usage object returns input/output incl cache tokens per request.
    Admin API (sk-ant-admin): GET /v1/organizations/usage_report/messages for
    historical token usage in 1m/1h/1d buckets, grouped by
    api_key/workspace/model/service_tier/context_window. GET
    /v1/organizations/cost_report returns actual USD by day and workspace --
    no token-to-cost calc needed (excludes Priority Tier). Claude Code
    Analytics API for per-user cost. Separate Claude Enterprise Analytics API
    (claude.ai Enterprise orgs) adds per-user and org-level token usage and
    cost over time, data from 2026-01-01. No scheduled/bulk export; manual CSV
    from the Console only.

- name: Google Gemini API
  slug: gemini
  domain: independent
  costApi: yes
  usageApi: partial
  billingExport: yes
  granularity: Per-response token counts; USD by SKU per day through Cloud Billing on the linked project, no key- or model-level history endpoint on the Gemini API itself

  website: https://ai.google.dev
  notes: >
    Gemini Developer API (AI Studio), distinct from Vertex AI (slug gcp). Every
    generateContent response includes a usageMetadata object (promptTokenCount,
    candidatesTokenCount, cachedContentTokenCount, thoughtsTokenCount,
    totalTokenCount), per request only, with no aggregate usage endpoint by API
    key or model. The Gemini API itself has no cost endpoint. Paid use bills
    through a linked Cloud Billing project, so USD spend is reachable the same
    way as GCP: Cloud Billing reports by SKU (generativelanguage.googleapis.com)
    and the scheduled BigQuery billing export, which is also the only export
    path because AI Studio has no CSV export of its own. costApi yes rests on
    that Cloud Billing surface, graded the same way as the AWS and GCP rows; the
    Gemini API alone would be partial (tokens times the price list). Spend-based
    rate limits (429 RESOURCE_EXHAUSTED) apply per 10-minute window by usage
    tier.

# ------------------------------------
# Independent Model Labs

# ------------------------------------

- name: Mistral AI
  slug: mistral
  domain: independent
  costApi: yes
  usageApi: yes
  billingExport: partial
  granularity: Per-model, per-request tokens; org cost by category per billing month (optional per-workspace) via Admin API

  website: https://mistral.ai
  notes: >
    Every API response includes a usage object with prompt_tokens,
    completion_tokens, and total_tokens. Preview Admin API (x-api-key, base
    /v1/admin): GET /usage returns org cost and consumption for a billing
    period (month/year params, optional workspace_id) broken down by category
    (chat, completion, ocr, audio, connectors, libraries_api, fine_tuning,
    vibe_usage) with currency -- actual monetary values, no token math. GET
    /spend-limit reads the monthly cap; /analytics/lechat and /analytics/vibe
    report activity over time ranges. CSV export from dashboard only; no
    scheduled or bulk export. Upgraded costApi from partial 2026-08-05 on the
    Preview Admin API.

- name: Cohere
  slug: cohere
  domain: independent
  costApi: partial
  usageApi: yes
  billingExport: partial
  granularity: Per-model, per-request (input tokens, output tokens, search units)

  website: https://cohere.com
  notes: >
    API responses include meta.billed_units with input_tokens, output_tokens,
    and search_units depending on the endpoint. Dashboard provides usage
    breakdown by model and API key with CSV export. No programmatic billing
    API or scheduled export. Enterprise plans include more granular reporting.

- name: MiniMax.io
  slug: minimax
  domain: independent
  costApi: no
  usageApi: partial
  billingExport: no
  granularity: Per-request token counts; current-window quota-remaining endpoint

  website: https://minimax.io
  notes: >
    Chat completions return a usage object (prompt/completion/total tokens,
    reasoning tokens) but it is response-only, not stored. Programmatic
    quota-remaining endpoints (POST /v1/token_plan/remains) return the current
    5h/weekly window remaining quota -- not USD and not history. No cost API:
    USD balance only in the dashboard. No usage-history aggregation and no
    billing export. The June 2026 M3 overhaul (token-based metering, refund
    portal) added no programmatic cost/usage/export API. Reconciled:
    billingExport corrected from yes to no.

- name: BytePlus
  slug: byteplus
  domain: independent
  costApi: yes
  usageApi: yes
  billingExport: yes
  granularity: Per-request token counts in API response; account-wide bill detail by product and billing period in real currency; scheduled bill files to object storage

  website: https://byteplus.com
  notes: >
    ModelArk LLM responses include a usage field (input/output tokens). A
    GetUsage token-usage admin API was documented previously, but its doc URL
    now redirects, so its current status is unverified. The BytePlus Billing
    Console API exposes ListBillDetail and ListBillOverviewByProd, which return
    real currency amounts (PayableAmount, PaidAmount, UnpaidAmount, Currency) by
    product and billing period. Bill Storage TOS syncs daily and monthly cost,
    split, and instance bill files to an object-storage bucket on a schedule.
    Both existed before 2026-08-05 and were missed in the prior audit; costApi
    and billingExport corrected from no to yes 2026-09-22.

- name: AI21 Labs
  slug: ai21
  domain: independent
  costApi: partial
  usageApi: partial
  billingExport: no
  granularity: per-request token usage in response; dashboard aggregates by model

  website: https://www.ai21.com
  notes: >
    First-party model maker (Jamba family) served via the AI21 Studio API.
    POST /studio/v1/chat/completions returns token counts in a usage field per
    request but no dollar values. costApi partial: USD only via dashboard
    (Account > Model usage) or by multiplying tokens by published per-token
    rates. usageApi partial: per-request tokens only, no queryable history
    endpoint. No CSV or programmatic billing export. Also resold via AWS
    Bedrock and Azure, where billing flows through those clouds.

- name: Alibaba Qwen
  slug: qwen
  domain: independent
  costApi: yes
  usageApi: yes
  billingExport: yes
  granularity: Cost/usage by billing-item, instance, model, API key, workspace, token type; daily or monthly cycle

  website: https://www.alibabacloud.com/help/en/model-studio
  notes: >
    Qwen models served via the DashScope / Model Studio API. Cost is covered two
    ways: the account-wide Alibaba Cloud BSS OpenAPI (QueryBill,
    DescribeInstanceBill, QueryInstanceBill) returns actual currency amounts
    (USD supported) at daily or monthly granularity, and a Model Studio scoped
    GetBillingOverview API (monthly billMonth) covers Model Studio directly.
    Per-request token usage is in every response; DescribeInstanceBill returns
    queryable usage history with billing-item token breakdown, and the console
    Model Usage page tracks call and token stats by API key, workspace, and
    model. SubscribeBillToOSS delivers bills to OSS daily, plus console CSV/PDF
    export (batch export up to 18 months).

- name: DeepSeek
  slug: deepseek
  domain: independent
  costApi: partial
  usageApi: partial
  billingExport: partial
  granularity: per-request token counts in response; per-currency balance via GET /user/balance; manual per-month export

  website: https://platform.deepseek.com
  notes: >
    Chinese lab serving its own DeepSeek V4/R models via an OpenAI-compatible
    API with public per-token pricing. Only four endpoints are documented
    (chat/completions, completions, models, GET /user/balance). costApi
    partial: /user/balance returns remaining funds (CNY or USD), not spend; USD
    cost must be computed from token counts times published rates. usageApi
    partial: per-request tokens only, dashboard-only history. billingExport
    partial: usage export is a manual dashboard action (select month, Export),
    no scheduled or programmatic export.

- name: Moonshot AI (Kimi)
  slug: moonshot
  domain: independent
  costApi: partial
  usageApi: partial
  billingExport: no
  granularity: Current USD balance via GET /v1/users/me/balance; per-request token counts in the response; no usage history

  website: https://platform.kimi.ai
  notes: >
    Kimi models served through an OpenAI-compatible API; the docs moved from
    platform.moonshot.ai to platform.kimi.ai. costApi partial: GET
    /v1/users/me/balance returns available_balance, voucher_balance and
    cash_balance in USD, a balance and not spend; requests fail once
    available_balance reaches zero. usageApi partial: chat completions return
    per-request token counts in the usage object, and POST
    /v1/tokenizers/estimate-token-count estimates before a call, but no endpoint
    aggregates usage or spend by key or model over time. billingExport no:
    invoices are requested by hand through Invoice Management on the dashboard,
    balance alerts are dashboard only, and no scheduled, bulk or CSV usage
    export is documented.

- name: Zhipu AI (Z.ai)
  slug: zhipu
  domain: independent
  costApi: no
  usageApi: partial
  billingExport: no
  granularity: Per-response token counts only; no documented account-level usage or balance API

  website: https://z.ai
  notes: >
    GLM models on an international OpenAI-compatible platform (docs.z.ai,
    api.z.ai) plus a separate China platform at open.bigmodel.cn. costApi no: no
    documented endpoint returns balance or spend in currency; the pricing page
    lists per-token rates for manual calculation. usageApi partial: every chat
    completion carries a usage object (prompt_tokens, completion_tokens,
    total_tokens, prompt_tokens_details.cached_tokens), but no documented
    account-level usage-history endpoint exists by model or key; the Coding Plan
    usage stats are dashboard only, and third-party trackers rely on
    undocumented api.z.ai/api/monitor/usage endpoints. billingExport no: a
    finance-center bill page exists in the China dashboard, but no CSV,
    scheduled or bulk export is documented and the page could not be inspected.

- name: xAI
  slug: xai
  domain: independent
  costApi: yes
  usageApi: yes
  billingExport: no
  granularity: per-request response usage (cost_in_usd_ticks, 1 USD = 1e10 ticks) plus aggregated history via Management API /usage with time buckets, group_by, and aggregations

  website: https://x.ai/api
  notes: >
    First-party Grok LLM vendor; pay-per-token API at api.x.ai. costApi yes:
    every /v1/chat/completions and /v1/responses returns usage with
    cost_in_usd_ticks (1 USD = 1e10 ticks), exact USD per request; the
    Management API POST /v1/billing/teams/{id}/usage returns aggregated USD.
    usageApi yes: the same response gives per-request tokens, and Management
    /usage is a queryable history endpoint (timeRange, timeUnit minute to
    month, groupBy model or API key, aggregations); Management also exposes
    invoices and prepaid balance in USD. billingExport no: console Usage
    Explorer only, no scheduled or CSV export.

- name: Perplexity
  slug: perplexity
  domain: independent
  costApi: yes
  usageApi: partial
  billingExport: no
  granularity: Per-response usage object (input, output, reasoning and citation tokens, search queries) with matching USD cost fields; no history endpoint

  website: https://www.perplexity.ai
  notes: >
    Sonar API (api.perplexity.ai). Every chat completions response includes a
    usage object whose cost sub-fields (input_tokens_cost, output_tokens_cost,
    reasoning_tokens_cost, request_cost, citation_tokens_cost,
    search_queries_cost, total_cost) are explicit USD amounts, so costApi is
    yes, but only per response, with no aggregate cost-history endpoint. The
    same object exposes token and search counts per response, so usageApi is
    partial: unit-level usage exists only inline on each call, not through a
    queryable usage-by-model or usage-by-key endpoint. The API portal Billing
    page shows a usage chart, a per-model quantity, rate and cost table, and
    invoice history, but the docs describe no CSV export and no bulk or
    scheduled export. A separate Analytics API (/v1/analytics/computer/usage)
    exists for Perplexity Enterprise organizations, but it covers the web
    product's credits and query volume, not Sonar API billing.

# ------------------------------------
# Inference Providers

# ------------------------------------

- name: Together AI
  slug: together
  domain: inference
  costApi: partial
  usageApi: yes
  billingExport: partial
  granularity: Per-request token counts in response; org-wide Billing Usage API (beta) returns per-line-item cost, quantity, and unit price by API key and project, queryable by month with daily or hourly windows

  website: https://together.ai
  notes: >
    API responses include prompt_tokens and completion_tokens in the usage
    object. Since 2026-08-27 a beta GET /billing/usage endpoint returns
    cost-annotated usage line items (USD cost, quantity, unit_price) filterable
    by billing month, with per-API-key and per-project attribution via the
    attributes field. The endpoint is enabled per organization on request and is
    not GA, so costApi is graded partial rather than yes until it is generally
    available. Dashboard CSV export remains the only export path.

- name: Groq
  slug: groq
  domain: inference
  costApi: partial
  usageApi: partial
  billingExport: no
  granularity: Per-model, per-request tokens

  website: https://groq.com
  notes: >
    API responses include usage object with prompt_tokens, completion_tokens,
    and total_tokens. Response headers expose queue time and processing time.
    Console has a usage dashboard but no programmatic usage history endpoint
    or billing export. Must self-instrument by logging per-request token counts.

- name: Replicate
  slug: replicate
  domain: inference
  costApi: partial
  usageApi: partial
  billingExport: no
  granularity: Compute seconds per run; multiply by hardware rate for USD

  website: https://replicate.com
  notes: >
    Predictions API returns metrics.predict_time (GPU/CPU seconds consumed)
    per run. Must multiply by the model's published hardware rate (e.g.
    $0.0001/sec for CPU, up to $0.0122/sec for 8x H100) to get USD cost.
    No billing export. Cost visibility roadmap deprioritized post-Cloudflare
    acquisition.

- name: fal.ai
  slug: fal
  domain: inference
  costApi: yes
  usageApi: yes
  billingExport: partial
  granularity: Per-request and per-billing-event cost in USD; aggregated usage by timeframe (minute/hour/day/week/month); on-demand FOCUS CSV report

  website: https://fal.ai
  notes: >
    Per-request queue result still has no cost field, but platform APIs (admin
    key) return actual USD. GET /v1/models/usage returns aggregated historical
    usage with USD cost and a time series (minute to month). GET
    /v1/models/billing-events returns per-request USD cost. GET /account/billing
    returns USD balance; GET /v1/models/pricing and POST .../estimate return
    USD. GET /account/focus downloads an on-demand FOCUS (FinOps) CSV report
    (enterprise-gated, 90-day lookback) -- programmatic CSV, not a scheduled
    bulk export to storage. Sept 2026: WebSocket endpoints can declare billable
    units via an x-fal-billable-units header or a follow-up POST, and GET
    /v1/serverless/apps exposes endpoint ids for the usage APIs.

- name: Baseten
  slug: baseten
  domain: inference
  costApi: yes
  usageApi: yes
  billingExport: no
  granularity: Per-deployment / per-model / per-training-job; daily; tokens and billable minutes; Model API spend by API key, user, model, or service tier

  website: https://baseten.co
  notes: >
    Management API (api.baseten.co/v1) GET /v1/billing/usage_summary returns
    actual USD (subtotal, credits_used, total) plus minutes, queryable by
    start_date/end_date (31-day max, from 2026-01-01), split into model serving,
    training, and Model APIs with per-resource and daily breakdown -- serves as
    both cost (USD) and usage history. GET /v1/instance_type_prices returns USD
    per minute. Added 2026-09-10: GET /v1/billing/model_apis returns exact daily
    rated USD subtotals for Model API spend, groupable by API key, user, model,
    or service tier. Prometheus /metrics is operational only. No scheduled or
    programmatic bulk billing export; invoices are dashboard-only.

- name: Cerebras
  slug: cerebras
  domain: inference
  costApi: no
  usageApi: partial
  billingExport: partial
  granularity: per-request token usage in response; Prometheus per-minute metrics; Console cost by model/token type per month

  website: https://cerebras.ai
  notes: >
    Wafer-scale pay-per-token inference (OpenAI-compatible). The inference API
    exposes only Chat, Completions, and Models, no usage or billing endpoints.
    costApi no: responses return token counts only; USD spend lives in the
    Console Cost tab (by model and token type, monthly), dashboard-only.
    usageApi partial: per-request tokens are returned but not queryable; GET
    /api/v1/metrics/organizations/{id} returns Prometheus gauges for the last
    complete minute (operational, not history). billingExport partial: Console
    "Download Report" CSV only, no scheduled or programmatic export.

- name: DeepInfra
  slug: deepinfra
  domain: inference
  costApi: yes
  usageApi: yes
  billingExport: partial
  granularity: per-request (POST /v1/request-costs, costNanoUsd) and per-model-per-month aggregate (GET /payment/usage)

  website: https://deepinfra.com
  notes: >
    Serverless per-token inference for open models, USD-denominated, no credits
    abstraction. costApi yes: GET /payment/usage, /payment/usage/tokens, and
    /payment/usage/{token} return cost in USD cents; POST /v1/request-costs
    returns per-request costNanoUsd. usageApi yes: /payment/usage is queryable
    by from/to (YYYY.MM or unix), returning months itemized by model with
    units, rate, and cost. billingExport partial: GET /payment/invoices lists
    invoices with PDF links programmatically, but there is no scheduled or bulk
    usage-export job.

- name: Novita AI
  slug: novita
  domain: inference
  costApi: yes
  usageApi: yes
  billingExport: partial
  granularity: per-bill line with cycleType (Hour/Day/Week/Month) and productCategory (llm/gpu/storage); monthly bills; USD as 1/10000 USD

  website: https://novita.ai
  notes: >
    Serverless LLM/image inference plus GPU cloud, with a documented OpenAPI
    billing suite. costApi yes: GET /openapi/v1/billing/bill/list and
    /billing/monthly/bill return amounts in direct USD fixed-point (1/10000
    USD); /billing/balance/detail returns balance. usageApi yes:
    /billing/bill/list is queryable by startTime/endTime (31-day window),
    cycleType granularity, and productCategory, returning per-period usage and
    cost. billingExport partial: monthly bills include a downloadable
    invoiceUrl, but no scheduled or bulk export pipeline.

- name: Fireworks AI
  slug: fireworks
  domain: inference
  costApi: yes
  usageApi: yes
  billingExport: yes
  granularity: per-request response usage; rated USD by billing category or grouped by hour/day/model/user/API key; daily token buckets (billingUsage); per-event export-metrics CSV (tokens-only)

  website: https://fireworks.ai
  notes: >
    Serverless pay-per-token inference plus fine-tuning. costApi yes: GET
    /v1/accounts/{id}/billing/summary returns rated USD line items by billing
    category (serverless, dedicated, training; optional daily buckets) and
    POST /v1/accounts/{id}/usageCosts:query returns rated USD subtotals
    grouped by HOUR/DAY/MODEL/USER/API_KEY over REST -- previously CLI-only.
    usageApi yes: billingUsage is a queryable daily-bucketed token history
    (groupBy by model, api_key, deployment, tags; 31-day windows) plus
    per-request usage in responses; covers text and audio only, no embeddings
    or images yet. billingExport yes: firectl billing export-metrics produces
    a bulk tokens-only CSV with documented cron automation and backfill.
    Upgraded costApi from partial 2026-08-05 on the new REST cost endpoints.

- name: SiliconFlow
  slug: siliconflow
  domain: inference
  costApi: partial
  usageApi: partial
  billingExport: partial
  granularity: per-request token counts in response; account balance in USD; aggregated usage/cost dashboard-only

  website: https://siliconflow.com
  notes: >
    Serverless OpenAI-compatible inference cloud, pay-per-token in USD. costApi
    partial: GET /v1/user/info returns balance and totalBalance as USD strings
    (balance only, not spend); USD cost requires tokens times a published rate
    (the API returns no price field). usageApi partial: the per-request usage
    object is not stored; aggregated usage and cost are dashboard-only.
    billingExport partial: a Mar 2026 release added dashboard billing export
    for reconciliation, but with no documented API or scheduled mechanism.

- name: SambaNova Cloud
  slug: sambanova
  domain: inference
  costApi: no
  usageApi: partial
  billingExport: no
  granularity: Per-response token usage and timing; dashboard usage by model and API key

  website: https://cloud.sambanova.ai
  notes: >
    OpenAI-compatible chat completions API. costApi no: no endpoint returns a
    currency amount; pricing is per token per model, so spend must be computed
    from tokens times price. usageApi partial: each response returns a usage
    object (prompt_tokens, completion_tokens, total_tokens, time_to_first_token,
    total_latency, completion_tokens_per_sec, cached and reasoning token
    detail), per response only, with no queryable usage-history endpoint;
    response headers expose rate-limit remaining and reset for requests and
    tokens. The dashboard Plans > Usage page shows usage by model and by API key
    and Plans > Billing shows monthly charges, but both are client-rendered
    views behind login and no CSV, scheduled or bulk export was found in the
    docs.

# ------------------------------------
# Generative Media

# ------------------------------------

- name: ElevenLabs
  slug: elevenlabs
  domain: generative
  costApi: partial
  usageApi: yes
  billingExport: partial
  granularity: Per-character/credit, per-product, per-voice, per-API-key, per-user, per-model, per-region, per-workspace, per-surface, per-actor; USD spend via fiat_units_spent metric (opt-in, five currencies)

  website: https://elevenlabs.io
  notes: >
    Usage history via POST
    /v1/workspace/analytics/query/usage-by-product-over-time (replaces the
    deprecated GET /v1/usage/character-stats), queryable by interval with
    group_by across 17 dimensions (surface and actor added Sept 2026) and column
    units spanning credits plus fiat currencies (usd, eur, gbp, inr, pln) when
    fiat_currency or fiat_charge_type is requested. Fiat units are opt-in and
    not documented as reconciling to invoiced amounts, so cost stays partial.
    GET /v1/user/subscription returns plan, limits, and credits. POST
    /v1/convai/agent/{agent_id}/llm-usage/calculate returns price_per_message
    (Sept 2026) for agent cost estimation. Billing export is manual dashboard
    CSV only; invoices download individually as PDF.

- name: Deepgram
  slug: deepgram
  domain: generative
  costApi: yes
  usageApi: yes
  billingExport: partial
  granularity: Per-request USD (response.details.usd); per-period USD by accessor, deployment, tag or line item; usage by accessor, endpoint, model, method, tag or deployment in hours, tokens, characters and requests over a date range

  website: https://deepgram.com
  notes: >
    Management API under /v1/projects/{id}. GET .../requests/{request_id}
    returns response.details.usd, a per-request USD figure, and GET
    .../billing/breakdown aggregates a dollars field by accessor, deployment,
    tag or line_item across a date range, both real currency, so cost is yes.
    GET .../usage/breakdown groups hours, agent_hours, tokens_in, tokens_out,
    tts_characters and requests by accessor, endpoint, model, method, tags or
    deployment with start and end filters, so usage is unit-level with history.
    GET .../balances returns amount plus units, a balance snapshot, not spend
    history. Whether the breakdown dollars reconcile exactly to the invoice is
    not stated. No scheduled or bulk export endpoint; the Console offers manual
    CSV export from the Usage tab, and invoices are unavailable on pay-as-you-go
    plans.

- name: AssemblyAI
  slug: assemblyai
  domain: generative
  costApi: partial
  usageApi: partial
  billingExport: partial
  granularity: Per-transcript audio_duration in seconds via GET /v2/transcript/{id}; balance, spend and usage charts in the dashboard only

  website: https://www.assemblyai.com
  notes: >
    GET /v2/transcript (list) returns id, status, created, completed, audio_url
    and resource_url per item, with no duration and no cost field, so
    per-request spend requires one fetch per transcript. GET /v2/transcript/{id}
    adds audio_duration in seconds, so cost can be derived against the published
    per-hour rate, but no response carries a USD amount. Balance, spend and
    usage (transcription activity, completion rate, spend activity, duration
    transcribed, webhook activity) live only on the dashboard Cost and Usage
    pages under Workspace > Manage; no documented endpoint exposes balance or
    spend. No scheduled or bulk billing export is documented; invoices are
    monthly, and the Processing Queue offers a manual CSV export of
    transcriptions, not billing records.

- name: Leonardo.ai
  slug: leonardo
  domain: generative
  costApi: partial
  usageApi: yes
  billingExport: no
  granularity: Per-generation cost object (amount plus unit, dollars or credits) in response; USD account balance under PAYG; credit balance via GET /me

  website: https://leonardo.ai
  notes: >
    GET /api/rest/v1/me returns remaining API credits/balance. Generation
    responses include a cost object (amount plus unit, dollars or credits) and
    apiCreditCost; under the new Pay-As-You-Go model balances are kept in USD
    and deducted in real time. POST /api/rest/v1/pricing-calculator estimates a
    request's USD cost before submission. No queryable usage-history endpoint.
    No scheduled/bulk billing export; invoices via the Paddle customer portal
    only.

- name: Runway
  slug: runway
  domain: generative
  costApi: partial
  usageApi: yes
  billingExport: no
  granularity: Credit balance and 90-day usage history by model and day
  verified: true

  website: https://runwayml.com
  notes: >
    GET /v1/organization returns credit balance and usage tier. POST
    /v1/organization/usage returns credit usage by model and day, queryable up
    to 90 days with date-range params. Billing is credits only at $0.01/credit;
    no per-call or aggregate USD field (USD derivable via the fixed credit
    rate). Autobilling is automatic credit top-up (web portal only). No billing
    export. July 2026 added Enterprise-only /v1/organization/webapp/usage
    (per-generation credit rows for linked web app workspaces) and
    /webapp/audit_logs -- credits not USD, on-demand pull, plan-gated, so
    billingExport stays no.

- name: Runware
  slug: runware
  domain: generative
  costApi: yes
  usageApi: yes
  billingExport: no
  granularity: Per-request USD cost in response (opt-in via includeCost); accountManagement getDetails (balance, credits/requests for today/7d/30d/lifetime) plus getUsageActivity, getUsagePerformance, getUsageErrors grouped by day, model, or API key

  website: https://runware.ai
  notes: >
    Pass includeCost: true for a per-task USD cost float. accountManagement also
    includes getUsageActivity, getUsagePerformance, and getUsageErrors (shipped
    2026-07-10, missed in the prior audit): date-range queries grouped by day,
    model, or apiKey, returning spend, request counts, p90/p99 latency, and
    4xx/5xx error rates. Whether spend in these three operations is USD or
    credits is not stated in the docs (getDetails rollups are credits). No CSV,
    S3, BigQuery, or scheduled export anywhere in the API.

- name: Soundraw
  slug: soundraw
  domain: generative
  costApi: no
  usageApi: no
  billingExport: no
  granularity: None

  website: https://soundraw.io
  notes: >
    Public B2B music-generation API launched around 2026-07 alongside the
    subscription SaaS, priced as flat monthly tiers by song volume (Starter 100
    songs, Pro 1,000 songs, Custom), not usage-metered. No cost, usage, or
    billing-export endpoint found in any public documentation; the developer
    reference sits behind a sales inquiry form and could not be inspected, so
    usageApi no is not fully proven.

- name: Recraft
  slug: recraft
  domain: generative
  costApi: partial
  usageApi: partial
  billingExport: no
  granularity: Credit balance via API, per-operation dollar costs

  website: https://recraft.ai
  notes: >
    GET /v1/users/me returns credit balance. Per-operation costs are
    documented in dollar terms via the API unit model ($1 = 1,000 API units),
    not the in-app credit system. API pricing was overhauled in 2025 with
    significant reductions. No usage history endpoint, no billing export.
    Web app and API have separate pricing models.

- name: Bria
  slug: bria
  domain: generative
  costApi: no
  usageApi: no
  billingExport: no
  granularity: None

  website: https://bria.ai
  notes: >
    No documented API endpoints for billing, credits, or usage. Action-based
    billing ($0.005-$0.08 per action). HTTP 429 on limit exceeded. All billing
    through platform dashboard only.

- name: Mureka
  slug: mureka
  domain: generative
  costApi: partial
  usageApi: partial
  billingExport: no
  granularity: Credit balance via billing endpoint; credits require rate conversion

  website: https://mureka.ai
  notes: >
    GET /v1/account/billing returns account credit balance as an abstract
    integer. Must multiply by per-credit rate to get USD (~$0.12-0.15/min
    of audio). Credits follow FIFO spending. Website and API credit systems
    are entirely separate. No usage history endpoint, no billing export.

- name: Luma
  slug: luma
  domain: generative
  costApi: yes
  usageApi: yes
  billingExport: no
  granularity: Credit balance via API (returned in USD cents); per-generation credit costs; queryable generations list endpoint

  website: https://lumalabs.ai
  notes: >
    GET /dream-machine/v1/credits returns credit_balance, documented in the
    OpenAPI spec as available balance in USD cents (actual USD obtainable). GET
    /dream-machine/v1/generations lists generations with pagination but carries
    no per-item cost field. Documented per-generation credit costs (image 4-8;
    video e.g. Ray3 720p 5s = 100 credits, 1080p HDR = 1600). No bulk or
    scheduled CSV export; dashboard usage only. Web and API credit wallets are
    separate.

- name: Black Forest Labs
  slug: blackforestlabs
  domain: generative
  costApi: partial
  usageApi: partial
  billingExport: no
  granularity: Per-request cost in response, credit balance via API

  website: https://blackforestlabs.ai
  notes: >
    GET /v1/credits returns remaining balance. Generation responses (e.g.
    /v1/flux-kontext-pro, /v1/flux-2-max) include a cost field with credits
    consumed per request. No usage history endpoint, no billing export.
    Billing managed via Stripe portal with PDF invoices only.

- name: Stability AI
  slug: stability
  domain: generative
  costApi: partial
  usageApi: partial
  billingExport: no
  granularity: Credit balance only; per-model credit prices published (1 credit = $0.01)

  website: https://platform.stability.ai
  notes: >
    GET /v1/user/balance returns the account's credit balance as a float
    (credits, not currency). GET /v1/user/account returns email, id, and
    organization membership, with no cost data. Stable Image and Stable Audio
    generation responses carry no cost or credits-consumed field, so per-request
    spend must be computed from the documented per-model credit price (1 credit
    = $0.01, for example Stable Image Ultra 8 credits, Stable Audio 3.0 26
    credits). No usage-history endpoint found. Manual invoicing exists only for
    accounts above $10,000 per month in spend, through a support request, not a
    self-serve export. The docs site is a client-rendered app, so the endpoint
    schemas were corroborated through a mirrored connector reference; whether
    the dashboard offers a manual CSV download is unverified.

- name: Cursor AI
  slug: cursorai
  domain: generative
  costApi: partial
  usageApi: yes
  billingExport: no
  granularity: Per-request, per-model, per-user token and cost data

  website: https://cursor.com
  notes: >
    Enterprise/Team Admin API (Basic Auth, ~20 req/min, 30-day max range): POST
    /teams/filtered-usage-events (per-event chargedCents, token usage, model,
    per-user; chargedCents includes a cursorTokenFee surcharge in cents when a
    third-party model serves the request, including when Auto routes to one);
    POST /teams/spend (per-member spendCents, current cycle); POST
    /teams/daily-usage-data (daily aggregates, no cost); GET /teams/groups
    (billing groups). Cost returned in cents. The Analytics API
    (/analytics/team/*, ~24 endpoints) gives queryable historical usage but no
    cost, except a cost_cents field on Bugbot review analytics. No billing
    export; third-party tools (Vantage, Finout) ingest via the Admin API.

# ------------------------------------
# AI Infrastructure

# ------------------------------------

- name: Marqo
  slug: marqo
  domain: infrastructure
  costApi: no
  usageApi: partial
  billingExport: no
  granularity: Index-level metrics; ecommerce event analytics (search/click/conversion)

  website: https://marqo.ai
  notes: >
    No billing or cost API. Cloud API v2 exposes index CRUD/search plus GET
    /indexes/{index}/stats (numberOfDocuments, numberOfVectors, memory and
    storage used %) -- point-in-time, no USD. Infrastructure-based pricing
    (per-index/shard, per-hour); billing visibility is dashboard-only with a
    Stripe-style portal; no programmatic or scheduled export. Repositioned to
    ecommerce search: added an Analytics API
    (overview/terms/funnel/time-series) for queryable ecommerce-event
    aggregates -- behavior analytics, not billing, no cost values. Datadog
    integration pushes operational metrics only.

- name: Nebius
  slug: nebius
  domain: infrastructure
  costApi: partial
  usageApi: partial
  billingExport: yes
  granularity: hourly FOCUS 1.2 line items with per-resource attribution over a billing-period range; Token Factory per-request token counts

  website: https://nebius.com
  notes: >
    Full-stack AI cloud (GPU) plus Token Factory serverless inference. Billing
    via gRPC (billing-data-plane.api.nebius.cloud). billingExport yes:
    OneTimeExportService (CLI billing one-time-export) is a programmatic bulk
    export of FOCUS 1.2 CSV or PDF over a billing-period range, deliverable to
    Object Storage, on demand via the API. The web console also offers a
    periodic export (console-configured, not via the API) that runs once per
    hour to Object Storage, FOCUS 1.2 CSV only, one active periodic export per
    contract. costApi partial: only CalculatorService estimates cost; actual USD
    comes from the FOCUS export file, not an inline query. usageApi partial:
    Token Factory returns per-request tokens but no USD, and consumption history
    is dashboard only.

- name: RunPod
  slug: runpod
  domain: infrastructure
  costApi: yes
  usageApi: yes
  billingExport: partial
  granularity: per serverless-endpoint / pod / GPU-type, time-bucketed (hour to year) over an arbitrary startTime/endTime range

  website: https://runpod.io
  notes: >
    GPU cloud: serverless endpoints (per-second) plus pods. REST API v2 (GA
    2026-08-18, api.runpod.io/v2) has a Billing resource: GET /v2/billing
    (aggregated), plus resource-specific endpoints for pods, serverless,
    network-volume, instant-cluster, and public-endpoint. All return USD
    amounts, time-bucketed (hour to year) over startTime/endTime, grouped by
    resource type -- actual USD, queryable, time-bucketed cost and usage
    history. Legacy GraphQL also exposes balance and dailyCharges in USD but
    retires in early 2027; REST API v1 retires 2026-11-15. billingExport
    partial: dashboard Billing Explorer and monthly PDF invoices, but no CSV or
    scheduled bulk export; the REST endpoints (JSON only) are the programmatic
    pull.

- name: Modal
  slug: modal
  domain: infrastructure
  costApi: yes
  usageApi: yes
  billingExport: yes
  granularity: per-App, per-Environment, per-day or per-hour cost; optional breakdown by CPU, memory, and GPU type; optional per-App-tag breakdown

  website: https://modal.com
  notes: >
    Code-first serverless GPU platform. One programmatic surface for all three:
    modal.billing.workspace_billing_report() Python API plus modal billing
    report CLI (GA v1.3.3, 2026-02, Team/Enterprise plans). Returns USD cost per
    App aggregated daily or hourly over --start/--end ranges, with an optional
    --show-resources breakdown by CPU, memory, and GPU type. costApi yes (USD,
    no conversion; cost is before credits/reservations). usageApi yes (queryable
    post-hoc aggregated history). billingExport yes (CLI --json or --csv,
    scriptable, with App tags); on demand, no vendor-managed scheduled drop.
    Added 2026-08: environment-scoped modal environment billing report and
    billing summary (same JSON/CSV export, plus monthly spend by category and
    credit usage) and Workspace.billing.rates() for current pricing.

- name: Cloudflare Workers AI
  slug: cloudflare
  domain: infrastructure
  costApi: yes
  usageApi: yes
  billingExport: partial
  granularity: Per-account cost by product per day (Billable Usage API); per-model inference usage by time range (GraphQL aiInferenceAdaptive dataset)

  website: https://developers.cloudflare.com/workers-ai/
  notes: >
    Serverless edge inference billed in Neurons, a unit that normalizes tokens,
    image tiles, diffusion steps, and audio seconds across model types, at
    $0.011 per 1,000 Neurons above a 10,000 per day free allocation. costApi
    yes: the account-level Billable Usage API (GET
    /accounts/{id}/billable-usage, alpha, being replaced by
    get_account_usage_v1) returns ContractedCost in the billing currency per
    product line including Workers AI, with ConsumedQuantity and Unit, daily
    granularity, in FOCUS format. usageApi yes: the GraphQL Analytics API
    exposes an aiInferenceAdaptive dataset for account-level Workers AI
    inference history, queryable by time range; the exact field list was not
    reachable in the docs. AI Gateway sits in front as an optional logging proxy
    and is out of scope here. billingExport partial: invoices are dashboard
    PDFs, and the Billable Usage API is a pull endpoint rather than a
    vendor-scheduled push to storage.

- name: CoreWeave
  slug: coreweave
  domain: infrastructure
  costApi: partial
  usageApi: yes
  billingExport: partial
  granularity: Hourly usage by resource (zone, cluster, SKU or capacity plan and rate class); Prometheus billing metrics over any time range

  website: https://www.coreweave.com
  notes: >
    GPU cloud for training and inference (CKS, SUNK, serverless inference, AI
    Object Storage). costApi partial: the FOCUS Usage Export API (GET
    api.coreweave.com/v1/billing/focus, public preview since 2026-09-11) returns
    hourly usage quantities in FOCUS 1.2 JSON or CSV but has no cost fields yet;
    CoreWeave says cost columns are planned. USD requires instance hours times
    the published on-demand rate, which the docs call an estimate. usageApi yes:
    Prometheus billing metrics (billing:instance:total,
    billing:object_storage_used_bytes:total, billing_resource_usage_storage,
    billing_ip_address) are queryable in Managed Grafana over any range by
    resource type, cluster, instance type and zone. billingExport partial: the
    FOCUS API is an on-demand pull (about a 90-day window per request, results
    inline, not scheduled, not delivered to object storage), and the Cloud
    Console Billing Insights page (2026-04-20) is a dashboard view; no scheduled
    bulk export found.
